name: Verify

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # - name: Remove unnecessary software to free up disk space
      #   run: |
      #     # inspired by https://github.com/easimon/maximize-build-space/blob/master/action.yml
      #     df -h
      #     sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup
      #     df -h

      - name: Install kani
        run: bash ./.github/install-kani.sh

      - name: Run Kani on Autoharness
        working-directory: verify-rust-std
        # This command only takes less than 40s to finish.
        # --include-pattern reduces time by skipping mismatched autoharness, but it still includes contract harnesses.
        # --harness reduces time by running the exact harness verification.
        run: |
          kani autoharness -Z autoharness -Z function-contracts -Z mem-predicates \
            -Z float-lib -Z c-ffi -Z loop-contracts -Z quantifiers -Z stubbing \
            --std ./library -Z unstable-options --harness-timeout 10m --default-unwind 1000 \
            --include-pattern intrinsics::verify::should_succeed_i32_to_u32 \
            --harness intrinsics::verify::should_succeed_i32_to_u32 
