name: Run Tests

on:
  push:
    branches: 

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kani and verify-rust-std
        run: |
          git submodule update --init --recursive verify-rust-std
          ./.github/install-kani.sh

      - name: Install distributed-verification
        run: cargo install --path . --locked

      - name: Verify Rust Std
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/gen_core.json.sh

      - name: View core.json
        working-directory: assets
        run: |
          ls -alh core.json
          head -n 1000 core.json

      - name: Upload core.json
        uses: actions/upload-artifact@v4
        with:
          name: artifact-libcore
          path: |
            assets/core.json
            assets/core.sqlite3
          compression-level: 9
          if-no-files-found: error

      - name: Run tests
        run: cargo test -- --nocapture

  kani-list:
    name: kani-list ${{ matrix.autoharness }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        autoharness: ["", "-autoharness"]
    if: true
    env:
      UNSTABLE_ARGS: -Z function-contracts -Z mem-predicates -Z float-lib -Z c-ffi -Z loop-contracts
      AUTO: ${{ matrix.autoharness }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install kani
        run: bash ./.github/install-kani.sh

      - name: Kani list
        working-directory: verify-rust-std
        if: ${{ env.AUTO }} == ''
        run:  kani list -Zlist ${{ env.UNSTABLE_ARGS }} --std ./library --format=json

      - name: Kani list
        working-directory: verify-rust-std
        if: ${{ env.AUTO }} == '-autoharness'
        run: kani autoharness -Z autoharness --list -Z list ${{ env.UNSTABLE_ARGS }} --std ./library --format=json

      - name: View list
        working-directory: verify-rust-std
        run: ls -alh kani-list.json && cat kani-list.json

      - name: Upload kani-list.json
        uses: actions/upload-artifact@v4
        with:
          name: artifact-kani-list${{ matrix.autoharness }}
          path: verify-rust-std/kani-list.json
          compression-level: 9
          if-no-files-found: error

